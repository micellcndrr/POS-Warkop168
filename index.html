<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasir - Warkop Pancong 168</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans h-screen flex flex-col overflow-hidden">

  <!-- Header Kasir -->
  <header class="bg-slate-800 border-b border-slate-700 px-6 py-3 flex justify-between items-center">
    <div>
      <h1 class="text-xl font-bold text-amber-400">Warkop Pancong 168</h1>
      <p class="text-xs text-slate-400">Mode Kasir • Anti-Backdate Aktif</p>
    </div>
    <div class="flex items-center gap-3">
      <span id="status-koneksi" class="px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
        ● Server Live
      </span>
      <a href="admin.html" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-lg text-slate-300">
        Panel Owner →
      </a>
    </div>
  </header>

  <!-- Konten Utama -->
  <main class="flex-1 flex flex-col md:flex-row overflow-hidden">
    
    <!-- Kiri: Daftar Menu -->
    <section class="flex-1 p-4 overflow-y-auto">
      <div class="flex gap-2 mb-4 overflow-x-auto pb-1">
        <button onclick="filterKategori('Semua')" class="kat-btn bg-amber-500 text-slate-900 font-bold px-4 py-1.5 rounded-lg text-sm">Semua</button>
        <button onclick="filterKategori('Makanan')" class="kat-btn bg-slate-800 text-slate-300 px-4 py-1.5 rounded-lg text-sm">Makanan</button>
        <button onclick="filterKategori('Minuman')" class="kat-btn bg-slate-800 text-slate-300 px-4 py-1.5 rounded-lg text-sm">Minuman</button>
        <button onclick="filterKategori('Tambahan')" class="kat-btn bg-slate-800 text-slate-300 px-4 py-1.5 rounded-lg text-sm">Tambahan</button>
      </div>

      <input type="text" id="cari-menu" oninput="renderMenu()" placeholder="Cari nama menu..." 
        class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-sm mb-4 focus:outline-none focus:border-amber-400">

      <div id="grid-menu" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3">
        <!-- Item menu dirender otomatis dari Firestore -->
      </div>
    </section>

    <!-- Kanan: Keranjang & Pembayaran -->
    <aside class="w-full md:w-96 bg-slate-800 border-t md:border-t-0 md:border-l border-slate-700 flex flex-col">
      <div class="p-4 border-b border-slate-700 flex justify-between items-center">
        <h2 class="font-bold text-base">Pesanan Saat Ini</h2>
        <button onclick="kosongkanKeranjang()" class="text-xs text-rose-400 hover:underline">Reset</button>
      </div>

      <div id="list-keranjang" class="flex-1 p-4 overflow-y-auto space-y-3">
        <p class="text-sm text-slate-500 text-center mt-10">Belum ada pesanan dipilih</p>
      </div>

      <div class="p-4 bg-slate-850 border-t border-slate-700 space-y-3">
        <div class="flex justify-between text-lg font-bold">
          <span>Total</span>
          <span id="total-harga" class="text-amber-400">Rp 0</span>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <button onclick="setMetode('Tunai')" id="btn-tunai" class="py-2 rounded-lg text-sm font-bold bg-amber-500 text-slate-900">
            💵 Tunai
          </button>
          <button onclick="setMetode('QRIS')" id="btn-qris" class="py-2 rounded-lg text-sm font-bold bg-slate-700 text-slate-300">
            📱 QRIS
          </button>
        </div>

        <input type="text" id="nama-kasir" placeholder="Nama Kasir Shift Ini (Wajib)" 
          class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-400">

        <button onclick="prosesBayar()" id="btn-bayar" 
          class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-extrabold py-3 rounded-xl text-base transition">
          SELESAIKAN PEMBAYARAN
        </button>
      </div>
    </aside>
  </main>

  <!-- Modal QRIS -->
  <div id="modal-qris" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
    <div class="bg-white text-slate-900 rounded-2xl p-6 max-w-xs w-full text-center space-y-4">
      <h3 class="font-bold text-lg">Scan QRIS Warkop 168</h3>
      <img id="img-qris" src="" alt="QRIS" class="w-56 h-56 mx-auto object-contain border rounded-lg">
      <p id="qris-nominal" class="font-extrabold text-xl text-emerald-600">Rp 0</p>
      <div class="flex gap-2">
        <button onclick="tutupModalQris()" class="flex-1 py-2 bg-slate-200 rounded-lg font-semibold text-sm">Batal</button>
        <button onclick="konfirmasiSimpanTransaksi()" class="flex-1 py-2 bg-emerald-600 text-white rounded-lg font-bold text-sm">Sudah Bayar</button>
      </div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, addDoc, doc, updateDoc, increment, serverTimestamp, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // TEMPEL KONFIGURASI FIREBASE KAMU DI SINI
    const firebaseConfig = {
      apiKey: "ISI_API_KEY_KAMU",
      authDomain: "ISI_PROJECT_ID.firebaseapp.com",
      projectId: "ISI_PROJECT_ID",
      storageBucket: "ISI_PROJECT_ID.appspot.com",
      messagingSenderId: "ISI_SENDER_ID",
      appId: "ISI_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let daftarMenu = [];
    let keranjang = [];
    let kategoriAktif = 'Semua';
    let metodeBayar = 'Tunai';
    let urlQris = '';

    // Ambil URL QRIS dari pengaturan
    getDoc(doc(db, "pengaturan", "toko")).then(snap => {
      if (snap.exists() && snap.data().qrisUrl) urlQris = snap.data().qrisUrl;
    });

    // Listen Menu Realtime
    onSnapshot(collection(db, "menu"), (snapshot) => {
      daftarMenu = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      renderMenu();
    });

    window.filterKategori = (kat) => {
      kategoriAktif = kat;
      document.querySelectorAll('.kat-btn').forEach(btn => {
        btn.className = btn.innerText === kat 
          ? 'kat-btn bg-amber-500 text-slate-900 font-bold px-4 py-1.5 rounded-lg text-sm'
          : 'kat-btn bg-slate-800 text-slate-300 px-4 py-1.5 rounded-lg text-sm';
      });
      renderMenu();
    };

    window.renderMenu = () => {
      const kataKunci = document.getElementById('cari-menu').value.toLowerCase();
      const grid = document.getElementById('grid-menu');
      grid.innerHTML = '';

      daftarMenu
        .filter(m => (kategoriAktif === 'Semua' || m.kategori === kategoriAktif) && m.nama.toLowerCase().includes(kataKunci))
        .forEach(m => {
          const habis = m.stok <= 0;
          grid.innerHTML += `
            <button onclick="${habis ? '' : `tambahKeKeranjang('${m.id}')`}" 
              class="p-3 rounded-xl border text-left transition flex flex-col justify-between h-28 ${habis ? 'bg-slate-800/40 border-slate-800 opacity-50 cursor-not-allowed' : 'bg-slate-800 border-slate-700 hover:border-amber-400'}">
              <div>
                <span class="text-[10px] uppercase tracking-wider text-slate-400">${m.kategori}</span>
                <h3 class="font-bold text-sm leading-tight mt-0.5">${m.nama}</h3>
              </div>
              <div class="flex justify-between items-end mt-2">
                <span class="text-amber-400 font-bold text-sm">Rp ${m.harga.toLocaleString('id-ID')}</span>
                <span class="text-xs ${habis ? 'text-rose-400 font-bold' : 'text-slate-400'}">Stok: ${m.stok}</span>
              </div>
            </button>
          `;
        });
    };

    window.tambahKeKeranjang = (id) => {
      const menu = daftarMenu.find(m => m.id === id);
      if (!menu) return;
      const itemAda = keranjang.find(k => k.id === id);
      if (itemAda) {
        if (itemAda.qty < menu.stok) itemAda.qty++;
        else alert('Stok menu tidak mencukupi!');
      } else {
        keranjang.push({ id: menu.id, nama: menu.nama, harga: menu.harga, qty: 1, orderTimeLocal: Date.now() });
      }
      renderKeranjang();
    };

    window.ubahQty = (id, delta) => {
      const idx = keranjang.findIndex(k => k.id === id);
      if (idx === -1) return;
      const menu = daftarMenu.find(m => m.id === id);
      const baru = keranjang[idx].qty + delta;
      if (baru <= 0) keranjang.splice(idx, 1);
      else if (menu && baru <= menu.stok) keranjang[idx].qty = baru;
      renderKeranjang();
    };

    window.kosongkanKeranjang = () => {
      keranjang = [];
      renderKeranjang();
    };

    function renderKeranjang() {
      const wadah = document.getElementById('list-keranjang');
      if (keranjang.length === 0) {
        wadah.innerHTML = '<p class="text-sm text-slate-500 text-center mt-10">Belum ada pesanan dipilih</p>';
        document.getElementById('total-harga').innerText = 'Rp 0';
        return;
      }
      let total = 0;
      wadah.innerHTML = '';
      keranjang.forEach(item => {
        total += item.harga * item.qty;
        wadah.innerHTML += `
          <div class="flex justify-between items-center bg-slate-900/70 p-2.5 rounded-lg border border-slate-700/70">
            <div>
              <h4 class="text-sm font-semibold">${item.nama}</h4>
              <p class="text-xs text-amber-400">Rp ${(item.harga * item.qty).toLocaleString('id-ID')}</p>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="ubahQty('${item.id}', -1)" class="w-7 h-7 bg-slate-700 rounded font-bold">-</button>
              <span class="text-sm font-bold w-5 text-center">${item.qty}</span>
              <button onclick="ubahQty('${item.id}', 1)" class="w-7 h-7 bg-slate-700 rounded font-bold">+</button>
            </div>
          </div>
        `;
      });
      document.getElementById('total-harga').innerText = 'Rp ' + total.toLocaleString('id-ID');
    }

    window.setMetode = (m) => {
      metodeBayar = m;
      document.getElementById('btn-tunai').className = m === 'Tunai' ? 'py-2 rounded-lg text-sm font-bold bg-amber-500 text-slate-900' : 'py-2 rounded-lg text-sm font-bold bg-slate-700 text-slate-300';
      document.getElementById('btn-qris').className = m === 'QRIS' ? 'py-2 rounded-lg text-sm font-bold bg-amber-500 text-slate-900' : 'py-2 rounded-lg text-sm font-bold bg-slate-700 text-slate-300';
    };

    window.prosesBayar = () => {
      const kasir = document.getElementById('nama-kasir').value.trim();
      if (keranjang.length === 0) return alert('Pilih menu terlebih dahulu!');
      if (!kasir) return alert('Isi Nama Kasir yang bertugas terlebih dahulu!');

      const total = keranjang.reduce((acc, i) => acc + (i.harga * i.qty), 0);
      if (metodeBayar === 'QRIS') {
        if (!urlQris) return alert('URL Gambar QRIS belum diatur oleh Owner di admin.html!');
        document.getElementById('img-qris').src = urlQris;
        document.getElementById('qris-nominal').innerText = 'Rp ' + total.toLocaleString('id-ID');
        document.getElementById('modal-qris').classList.remove('hidden');
      } else {
        konfirmasiSimpanTransaksi();
      }
    };

    window.tutupModalQris = () => document.getElementById('modal-qris').classList.add('hidden');

    window.konfirmasiSimpanTransaksi = async () => {
      tutupModalQris();
      const btn = document.getElementById('btn-bayar');
      btn.disabled = true;
      btn.innerText = 'MENYIMPAN KE SERVER...';

      const kasir = document.getElementById('nama-kasir').value.trim();
      const total = keranjang.reduce((acc, i) => acc + (i.harga * i.qty), 0);
      const pertamaInput = Math.min(...keranjang.map(i => i.orderTimeLocal));
      const durasiInputDetik = Math.round((Date.now() - pertamaInput) / 1000);

      try {
        // 1. Simpan transaksi dengan serverTimestamp() (Anti-Backdate)
        await addDoc(collection(db, "transaksi"), {
          kasir: kasir,
          items: keranjang.map(i => ({ id: i.id, nama: i.nama, harga: i.harga, qty: i.qty })),
          total: total,
          metode: metodeBayar,
          durasiInputDetik: durasiInputDetik,
          serverTime: serverTimestamp() // Waktu dikunci 100% oleh server Google
        });

        // 2. Potong stok menu otomatis
        for (const item of keranjang) {
          await updateDoc(doc(db, "menu", item.id), {
            stok: increment(-item.qty)
          });
        }

        kosongkanKeranjang();
        alert('✅ Transaksi tersimpan secara real-time!');
      } catch (err) {
        alert('Gagal menyimpan transaksi: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = 'SELESAIKAN PEMBAYARAN';
      }
    };
  </script>
</body>
</html>
